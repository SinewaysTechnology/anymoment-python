[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anymoment"
version = "1.0.0"
description = "Python SDK and CLI for AnyMoment API - Create and manage your schedule with natural language, write moments the way you think them."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "David Jonas @ Sineways Technology", email = "info@sineways.tech"}
]
keywords = ["calendar", "recurring-events", "scheduling", "api", "cli", "anymoment"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Scheduling",
]

dependencies = [
    "requests>=2.28.0",
    "pyjwt>=2.8.0",
    "cryptography>=41.0.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
cli = [
    "click>=8.0.0",
]

[project.scripts]
anymoment = "anymoment.cli.commands:cli"

[project.urls]
Homepage = "https://anymoment.sineways.tech"
Documentation = "https://anymoment.sineways.tech/anymoment-python/docs"
Repository = "https://github.com/SinewaysTechnology/anymoment-python"
Issues = "https://github.com/SinewaysTechnology/anymoment-python/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["anymoment*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-m", "not live", "--strict-markers", "-ra"]
markers = [
    "live: read-only smoke against a real AnyMoment API (ANYMOMENT_BASE_URL and ANYMOMENT_TEST_TOKEN)",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["anymoment", "tests"]

[tool.ruff.lint]
# Pyflakes and syntax errors. Style-only rules stay off until the 2.0 rewrite.
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Click registers one callback per group; those functions intentionally reuse names.
# F401/F541/F841 here are pre-existing and stay until the 2.0 rewrite.
"anymoment/cli/commands.py" = ["F811", "F401", "F541", "F841"]
"anymoment/token_manager.py" = ["F401", "F841"]

[tool.mypy]
python_version = "3.10"
files = ["anymoment"]
ignore_missing_imports = true
warn_unused_configs = true
pretty = true
show_error_codes = true
# Click command callbacks are registered per group and reuse function names.
disable_error_code = ["no-redef"]

[[tool.mypy.overrides]]
module = "anymoment.client"
# Query dicts are inferred too narrowly (str vs bool or int). Tighten the annotations in 2.0.
disable_error_code = ["assignment"]
